seed: 0
mode: research
logging:
  enable_tb: false
  tb_log_every: 10
  enable_wandb: false
  wandb_project: passive-walker

env:
  xml_path: passive_walker/assets/passiveWalker_model.xml
  ctrl_hz: 60
  simend: 30.0

control:
  use_nn_for_hip: true
  use_nn_for_knees: true
  kp: [5.0, 1000.0, 1000.0]
  kv: [1.0, 100.0, 100.0]
  umin: [-50.0, -800.0, -800.0]
  umax: [50.0, 800.0, 800.0]

reward:
  preset: default
  overrides: {}

physics:
  ramp_deg_min: 10.0
  ramp_deg_max: 14.0
  friction: [0.8, 1.0]
  mass_jitter: 0.05
  randomize_physics: false

termination:
  fall_pitch_max: 1.0
  fall_z_min: 0.15
  max_idle_speed: 0.005
  enable_stall_termination: false

fsm:
  contact_height: 0.05
  knee_release_threshold: 0.10
  hip_swing_pos: 0.5
  hip_swing_neg: -0.5
  knee_stance: 0.0
  knee_retract: -0.25

render:
  camera_distance: 8.0
  rgb_array_width: 1200
  rgb_array_height: 900

debug:
  log_quality: false
  log_fsm: false

ppo:
  # Vectorization
  num_envs: 4
  vec_backend: subproc
  steps_per_env: 64
  # Training
  epochs: 5
  minibatches: 8
  gamma: 0.99
  lam: 0.95
  clip: 0.2
  vf_coef: 0.5
  ent_coef: 0.0
  lr: 3e-4
  engine: mujoco   # placeholder for future: brax
  # JAX toggles
  use_jax_reward: false  # use JAX reward computation (not active yet)
  use_jax_pd: false      # use JAX PD control (not active yet)

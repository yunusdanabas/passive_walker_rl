mode: "fsm"            # "fsm" | "research"

env:
  simend: 30.0
  ctrl_hz: 60
  xml_path: "passive_walker/assets/passiveWalker_model.xml"
  randomize_physics: false

physics:
  ramp_deg_min: 10.0
  ramp_deg_max: 14.0
  friction: [0.8, 1.0]
  mass_jitter: 0.05
  fall_z_min: 0.15
  fall_pitch_max: 1.0

control:
  kp: [5.0, 1000.0, 1000.0]
  kv: [1.0, 100.0, 100.0]
  umin: [-50.0, -800.0, -800.0]
  umax: [50.0, 800.0, 800.0]
  joint_ranges: [[-0.5, 0.5], [-0.5, 0.5], [-0.5, 0.5]]
  use_nn_for_hip: false
  use_nn_for_knees: false

terminations:
  fall_z_min: 0.15
  fall_pitch_max: 1.0

reward:
  preset: "default"     # "minimal" | "default" | "aggressive"
  overrides: {}         # e.g., { c_ac: 0.0002, vx_star: 1.0 }

jax:
  enable: false         # use JAX paths where available
  batched: false        # if true, expect vectorized signals/actions in callers

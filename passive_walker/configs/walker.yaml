mode: "fsm"            # "fsm" | "research"

env:
  simend: 30.0
  ctrl_hz: 60
  xml_path: "passive_walker/assets/passiveWalker_model.xml"
  randomize_physics: false

physics:
  ramp_deg_min: 10.0
  ramp_deg_max: 14.0
  friction: [0.8, 1.0]
  mass_jitter: 0.05
  fall_z_min: 0.15
  fall_pitch_max: 1.0
  randomize_physics: false

control:
  kp: [5.0, 1000.0, 1000.0]
  kv: [1.0, 100.0, 100.0]
  umin: [-50.0, -800.0, -800.0]
  umax: [50.0, 800.0, 800.0]
  joint_ranges: [[-0.5, 0.5], [-0.5, 0.5], [-0.5, 0.5]]
  use_nn_for_hip: false
  use_nn_for_knees: false

terminations:
  fall_z_min: 0.15
  fall_pitch_max: 1.0
  max_idle_speed: 0.1
  enable_stall_termination: false

reward:
  preset: "default"     # "minimal" | "default" | "aggressive"
  overrides: {}         # e.g., { c_ac: 0.0002, vx_star: 1.0 }

fsm:
  contact_height: 0.02
  knee_release_threshold: 0.01
  hip_swing_pos: 0.3
  hip_swing_neg: -0.3
  knee_stance: 0.0
  knee_retract: 0.2

render:
  camera_distance: 3.0
  rgb_array_width: 640
  rgb_array_height: 480

debug:
  log_quality: false
  log_fsm: false
  verbose_info: false

jax:
  enable: false         # use JAX paths where available
  batched: false        # if true, expect vectorized signals/actions in callers

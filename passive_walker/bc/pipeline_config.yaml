# BC Training Pipeline Configuration
# Most important parameters first, then less important ones

# =============================================================================
# MOST IMPORTANT PARAMETERS
# =============================================================================

# Control section (MOST IMPORTANT)
section: "hip"  # Options: hip, knees, both, both-adv

# Training backend
backend: "torch"  # Options: torch, jax

# Data collection
episodes: 200  # Number of FSM episodes to collect
steps: 2000    # Steps per episode

# =============================================================================
# TRAINING PARAMETERS
# =============================================================================

# Training configuration
epochs: 30
batch_size: 1024
learning_rate: 0.001
label_type: "act"  # Options: act, qdes

# =============================================================================
# EVALUATION PARAMETERS
# =============================================================================

# Evaluation settings
eval_episodes: 10
eval_seconds: 25.0
gui: true

# =============================================================================
# ADVANCED PARAMETERS
# =============================================================================

# Frame stacking for temporal context
frame_stack: 1

# Advanced loss weights (for both-adv section)
loss_weights:
  w1: 1.0    # L1 loss weight
  w2: 0.0    # MSE loss weight
  w3: 0.1    # Smoothness loss weight
  w4: 0.01   # Bound penalty weight

# Data settings
min_episodes: 50  # Minimum episodes required (skip collection if available)

# =============================================================================
# SYSTEM PARAMETERS
# =============================================================================

# Directories
data_dir: "data/fsm_runs"
results_dir: "results/bc_pipeline"

# Random seed
seed: 123

# =============================================================================
# PRESET CONFIGURATIONS
# =============================================================================

# Quick test configuration
quick_test:
  section: "hip"
  backend: "torch"
  episodes: 20
  steps: 500
  epochs: 5
  eval_episodes: 3
  gui: false
  results_dir: "results/quick_test"

# Full control configuration
full_control:
  section: "both"
  backend: "jax"
  episodes: 300
  epochs: 50
  batch_size: 512
  learning_rate: 0.0005
  eval_episodes: 15
  gui: false

# Advanced training configuration
advanced:
  section: "both-adv"
  backend: "torch"
  episodes: 200
  epochs: 40
  frame_stack: 2
  loss_weights:
    w1: 1.0
    w2: 0.1
    w3: 0.2
    w4: 0.05
  eval_episodes: 15
  gui: false
  results_dir: "results/advanced_bc"

# Advanced hip-only configuration (should work better)
advanced_hip:
  section: "hip"
  backend: "torch"
  episodes: 500  # More data for better learning
  steps: 3000    # Longer episodes
  epochs: 100    # More training
  batch_size: 512  # Smaller batch for stability
  learning_rate: 0.0005  # Lower learning rate
  frame_stack: 3  # Temporal context
  eval_episodes: 20
  eval_seconds: 30.0
  gui: true
  results_dir: "results/advanced_hip"

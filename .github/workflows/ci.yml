name: ci
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-lock.txt || true
      - run: pip install -e . pytest black ruff
      - run: ruff check passive_walker/
      - run: black --check passive_walker/
      - run: pytest -q

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (headless MuJoCo safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxmu6 libxi6 libglu1-mesa patchelf wget

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test] || pip install -e .
          # if you have extras in pyproject, great; otherwise this still works
          pip install pytest ruff black

      - name: Lint
        run: |
          ruff check passive_walker/ tests/ scripts/
          black --check passive_walker/ tests/ scripts/

      - name: Unit tests
        env:
          MUJOCO_GL: "egl"
        run: |
          pytest -q